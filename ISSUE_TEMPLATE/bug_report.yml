name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown on the About page in the app.
      placeholder: "0.x.y"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How is it deployed?
      options:
        - Docker compose
        - Other
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - amd64
        - arm64
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Name and version.
      placeholder: Firefox 130
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste relevant logs. Redact all financial data, tokens and AUTH_SECRET before posting.
      render: shell
  - type: checkboxes
    id: sensitive-data
    attributes:
      label: Sensitive data check
      options:
        - label: This report does not contain sensitive financial data, tokens or secrets.
          required: true
